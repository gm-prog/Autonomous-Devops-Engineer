# Phase 8.4.2 — E2E-only override. Never part of the default contract:
#   docker compose -f devops-ai-platform/docker-compose.yml -f docker-compose.e2e.yml up -d
# Image refs are digest-resolved by the harness before `up` (§8); the
# defaults below only exist so `compose config` validation can run.
services:
  postgres:
    image: ${E2E_POSTGRES_IMAGE:?E2E_POSTGRES_IMAGE must be a name@sha256:<64hex> reference}
  redis:
    image: ${E2E_REDIS_IMAGE:?E2E_REDIS_IMAGE must be a name@sha256:<64hex> reference}
  qdrant:
    image: ${E2E_QDRANT_IMAGE:?E2E_QDRANT_IMAGE must be a name@sha256:<64hex> reference}

  agent-service:
    build:
      context: ./devops-ai-platform
      dockerfile: ./agent_service/Dockerfile.e2e
      args:
        BASE_IMAGE: ${E2E_PYTHON_BASE_IMAGE:?BASE_IMAGE must be a name@sha256:<64hex> reference}
    environment:
      - E2E_DETERMINISTIC_RCA=true

  deployment-service:
    build:
      context: ./devops-ai-platform
      dockerfile: ./deployment_service/Dockerfile.e2e
      args:
        BASE_IMAGE: ${E2E_PYTHON_BASE_IMAGE:?BASE_IMAGE must be a name@sha256:<64hex> reference}
    environment:
      - DEPLOYMENT_EXECUTION_ENABLED=true
      - GITHUB_OAUTH_TOKEN=${E2E_FIXTURE_GITHUB_TOKEN:-}
      - DEPLOYMENT_KUBECONFIG_PATH=/etc/deployment/kubeconfig
      - DEPLOYMENT_ALLOWED_NAMESPACES=devops-production-namespace
      - HEALTHCHECK_ALLOWED_HOSTS=${E2E_HEALTHCHECK_ALLOWED_HOSTS:-}
    volumes:
      - ${E2E_KUBECONFIG_HOST_PATH:-/tmp/ares-e2e-kubeconfig}:/etc/deployment/kubeconfig:ro

  incident-service:
    build:
      context: ./devops-ai-platform
      dockerfile: ./incident_service/Dockerfile.e2e
      args:
        BASE_IMAGE: ${E2E_PYTHON_BASE_IMAGE:?BASE_IMAGE must be a name@sha256:<64hex> reference}
    environment:
      - REMEDIATION_SANDBOX_IMAGE=${REMEDIATION_SANDBOX_IMAGE:?E2E requires a digest-pinned sandbox image}
      - REMEDIATION_VALIDATION_PROFILE=e2e_fixture
      - REMEDIATION_PROPOSAL_TTL_SECONDS=${REMEDIATION_PROPOSAL_TTL_SECONDS:-600}
      - GITHUB_OAUTH_TOKEN=${E2E_FIXTURE_GITHUB_TOKEN:-}
      - GITHUB_DEFAULT_BASE_BRANCH=main
      - REMEDIATION_WORKSPACE_ROOT=/tmp/ares-e2e-workspaces
    volumes:
      # Sandbox runs as sibling containers of this service; there is no
      # host-process fallback (Phase 6.2.2) — docker.sock is the only
      # execution channel and the profile/argv remain code-owned.
      - /var/run/docker.sock:/var/run/docker.sock
      # §6 host-visible workspace root: mounted at the SAME absolute path
      # on the runner host and inside this container, so the daemon-side
      # bind source the sandbox requests exists on the daemon host.
      # Dedicated single directory only — never all of /tmp.
      - /tmp/ares-e2e-workspaces:/tmp/ares-e2e-workspaces

  # Phase 8.4.2-D §6.2: every production Dockerfile that the E2E
  # workflow would otherwise build is redirected to an E2E-specific
  # digest-controlled Dockerfile. Production Dockerfiles stay
  # tag-based by design and are NOT built by this workflow.
  api-gateway:
    build:
      context: ./devops-ai-platform
      dockerfile: ./api_gateway/Dockerfile.e2e
      args:
        BASE_IMAGE: ${E2E_PYTHON_BASE_IMAGE:?BASE_IMAGE must be a name@sha256:<64hex> reference}
  repo-service:
    build:
      context: ./devops-ai-platform
      dockerfile: ./repo_service/Dockerfile.e2e
      args:
        BASE_IMAGE: ${E2E_PYTHON_BASE_IMAGE:?BASE_IMAGE must be a name@sha256:<64hex> reference}
  monitoring-service:
    build:
      context: ./devops-ai-platform
      dockerfile: ./monitoring_service/Dockerfile.e2e
      args:
        BASE_IMAGE: ${E2E_PYTHON_BASE_IMAGE:?BASE_IMAGE must be a name@sha256:<64hex> reference}
  incident-event-worker:
    build:
      context: ./devops-ai-platform
      # reuse the incident E2E image (same source tree; compose `command`
      # selects the worker entrypoint at runtime)
      dockerfile: ./incident_service/Dockerfile.e2e
      args:
        BASE_IMAGE: ${E2E_PYTHON_BASE_IMAGE:?BASE_IMAGE must be a name@sha256:<64hex> reference}
