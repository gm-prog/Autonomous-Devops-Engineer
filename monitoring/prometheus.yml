global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- RAW PROM INTEGRATION ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --- FASTAPI BACKEND TELEMETRY TARGETS ---
  # The gateway now serves /metrics (devops_api_requests_total, process collectors)
  - job_name: 'devops-api-gateway'
    static_configs:
      - targets: ['api:8000']

  # --- QDRANT VECTOR STORE (native /metrics on 6333) ---
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
