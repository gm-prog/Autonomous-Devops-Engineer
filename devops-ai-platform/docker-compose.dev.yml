# Development-only override - NEVER used by default.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Re-publishes internal service ports on the host for local debugging.
# The production topology (docker-compose.yml alone) exposes only the API
# gateway (8000) to the host; all other services are reachable exclusively
# over the private compose network.
services:
  postgres:
    ports:
      - "5432:5432"
  redis:
    ports:
      - "6379:6379"
  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"
  repo-service:
    ports:
      - "8010:8010"
  agent-service:
    ports:
      - "8020:8020"
  deployment-service:
    ports:
      - "8030:8030"
  monitoring-service:
    ports:
      - "8040:8040"
  incident-service:
    ports:
      - "8050:8050"
