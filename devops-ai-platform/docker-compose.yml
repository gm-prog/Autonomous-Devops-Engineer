# =============================================================================
# CANONICAL Phase 8.7-D.1 stack — gateway + agent + shared Redis
# =============================================================================
# This is the D1 production path for the authenticated repository-analysis
# stack. It declares ONLY the services this phase requires:
#
#   * api-gateway  — typed, JWT-authenticated control plane (user-facing;
#                    exposes 8000 so operators can reach the API).
#   * agent-service — internal analysis boundary (NOT exposed to the host;
#                    reached only through the gateway).
#   * redis        — shared state for the gateway's analysis rate limiter
#                    and the agent's AI budget ledger (NOT exposed to the
#                    host).
#   * deployment-api    — the deployment engine's authenticated HTTP
#                    contract (NOT exposed to the host; canonical DNS
#                    name `deployment-service`, port 8030 over d1).
#   * deployment-worker — the same image with the celery entrypoint;
#                    owns sandbox execution (disabled by default; no
#                    daemon access in this canonical stack — see the
#                    service comments and SECURITY.md).
#
# The older broad stack (postgres/qdrant/celery) is quarantined in
# docker-compose.legacy.yml — do not use it for the D1 path.
#
# Secrets are EXTERNALLY SUPPLIED; nothing secret is committed or baked into
# the images:
#   * JWT_SECRET            — REQUIRED (fail closed; see SECURITY.md).
#   * AGENT_INTERNAL_TOKEN  — REQUIRED (gateway->agent hop credential).
#   * GEMINI_API_KEY        — OPTIONAL. When empty the agent-service fails
#     CLOSED (503) on analysis instead of fabricating a response; the boot
#     smoke test verifies exactly that behavior.
#
# Image references are pinned to immutable digests (resolved 2026-10-08):
#   * redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
#   * python base for both services:
#     python:3.11-slim@sha256:0dd364ba7e10242f07755449e3a3d0e35f9efd987952737b90def6709ab0c5ce
#
# Usage:
#   export JWT_SECRET="<32+ random chars>" AGENT_INTERNAL_TOKEN="<32+ random chars>"
#   docker compose up --build
# =============================================================================

services:
  redis:
    image: redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
    container_name: devops_d1_redis
    # No host ports: the shared store is internal to the D1 network.
    expose:
      - "6379"
    networks:
      - d1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: devops_d1_api_gateway
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set — see SECURITY.md}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN must be set — see SECURITY.md}
      # Shared rate-limit state for the expensive analysis route.
      - REDIS_URL=redis://redis:6379/0
      - ANALYSIS_RATE_LIMIT_STORE=redis
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - d1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  agent-service:
    build:
      context: .
      dockerfile: ./agent-service/Dockerfile
    container_name: devops_d1_agent_service
    # NOT exposed to the host: the analysis boundary is internal and is
    # reached only through the gateway's authenticated route.
    expose:
      - "8020"
    environment:
      # Production posture: the budget ledger is backed by the shared
      # Redis below, satisfying the staging/production shared-state
      # contract (an in-process ledger would be refused at startup).
      - APP_ENV=production
      # OPTIONAL: empty => the analysis endpoint fails closed (503) rather
      # than fabricating a provider response (verified by the smoke test).
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN must be set — see SECURITY.md}
      # Shared AI budget ledger across replicas.
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_BUDGET_STORE=redis
      - GEMINI_MONTHLY_BUDGET_USD=${GEMINI_MONTHLY_BUDGET_USD:-150}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - d1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------
  # Phase 8.8A Correction-1 (F1/F7): the deployment runtime is SPLIT into
  # an API and a worker that share ONE image (deployment_service/
  # Dockerfile, pinned base + hash-pinned lock):
  #   * deployment-api    — uvicorn on 8030 (the canonical
  #                         `deployment-service` DNS name, which the
  #                         gateway's deployment route depends on);
  #                         validates, persists and enqueues. It holds NO
  #                         Docker daemon access and NO sandbox authority.
  #   * deployment-worker — the same image with the celery `command:`;
  #                         the ONLY deployment role with execution
  #                         authority, and in this canonical stack it
  #                         holds NO daemon access either: sandbox
  #                         execution is deliberately unavailable here
  #                         (execution disabled by default + no daemon ⇒
  #                         any execute fails closed with a typed state).
  #                         The disposable E2E overlay
  #                         (docker-compose.e2e.yml) is the only place
  #                         that grants the daemon, and only to this
  #                         service, in a disposable environment.
  # ---------------------------------------------------------------------
  deployment-api:
    build:
      context: .
      dockerfile: ./deployment_service/Dockerfile
    # The canonical DNS name the gateway's deployment route
    # (deployment-service:8030) depends on.
    container_name: deployment-service
    # NOT exposed to the host: the deployment execution boundary is
    # internal (Phase 8.8A) and is reached only over the d1 network —
    # the gateway's deployment route uses deployment-service:8030 and
    # the gRPC default deployment-service:50053 (no gRPC server is
    # exposed in this slice; the HTTP boundary is the real service).
    expose:
      - "8030"
    environment:
      # Authenticated deployment API (Phase 8.8A Correction-1, F2): the
      # same HS256 JWT contract as the gateway, plus the internal
      # service token. Both are REQUIRED by the :? operator above; a
      # misconfigured process fails closed (503) on every sensitive
      # route — there is no bundled fallback secret.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set — see SECURITY.md}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN must be set — see SECURITY.md}
      # Broker: the shared internal Redis (same store the D1 services
      # already use) — dry-run persistence and execution dispatch.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # FAIL CLOSED BY DEFAULT: real cluster execution is refused with a
      # typed error unless an operator explicitly enables it in a
      # deliberately configured environment. Dry run / approval remain
      # available; execution of an approved plan additionally requires
      # a provisioned, policy-bound sandbox environment.
      - DEPLOYMENT_EXECUTION_ENABLED=${DEPLOYMENT_EXECUTION_ENABLED:-false}
      # OPTIONAL: server-side source-revision verification. Empty means
      # the unauthenticated GitHub API is used at a low rate limit; a
      # revision the service cannot confirm fails the dry run — it is
      # never faked.
      - GITHUB_OAUTH_TOKEN=${GITHUB_OAUTH_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - d1
    healthcheck:
      # The declared contract: a live API process AND a reachable broker.
      # A worker-only image can never satisfy this — that is exactly the
      # mismatch this split exists to close (F1).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  deployment-worker:
    build:
      context: .
      dockerfile: ./deployment_service/Dockerfile
    container_name: devops_d1_deployment_worker
    # Same image as the API — different entrypoint. The worker consumes
    # the deployment queue and owns sandbox execution under a fenced
    # Redis lease (Phase 8.8A Correction-1, F5/F7).
    # Audit P1: explicit pool at the launch site — prefork with one
    # child, so the acks-late / reject-on-worker-lost broker semantics
    # (tasks.py broker_semantics) apply deterministically.
    command: ["celery", "-A", "deployment_service.infrastructure.celery.tasks.celery_app", "worker", "-P", "prefork", "--concurrency=1", "--loglevel=info"]
    # No ports and, in the canonical stack, no volumes: the worker is
    # reachable only over the d1 network and has no daemon, no
    # kubeconfig and no staging root to execute against. Enabling
    # execution here is therefore fail-closed by construction.
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set — see SECURITY.md}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN must be set — see SECURITY.md}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEPLOYMENT_EXECUTION_ENABLED=${DEPLOYMENT_EXECUTION_ENABLED:-false}
      - GITHUB_OAUTH_TOKEN=${GITHUB_OAUTH_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - d1
    healthcheck:
      # Worker liveness/readiness: the worker must answer a live broker
      # round-trip (celery inspect ping) — a started-but-wedged worker
      # is not ready.
      test: ["CMD", "celery", "-A", "deployment_service.infrastructure.celery.tasks.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

networks:
  d1:
    internal: false
