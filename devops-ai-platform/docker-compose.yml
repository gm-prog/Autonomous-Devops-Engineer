version: "3.8"

# DevOps.AI Operator Platform - full local stack.
# Service hostnames/ports match the api-gateway routing matrix
# (see api_gateway/routers/gateway_router.py SERVICES).

services:
  postgres:
    image: postgres:15-alpine
    container_name: devops_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devops_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: devops_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  # --- BFF GATEWAY (HS256 JWT auth) ---
  api-gateway:
    build:
      context: .
      dockerfile: ./api_gateway/Dockerfile
    container_name: devops_api_gateway
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/devops_prod
      - REDIS_HOST=redis
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Strong secret for the gateway's HS256 JWT auth. Omit for local dev
      # (a development fallback is used + warning logged); always set a real
      # value before exposing the gateway.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      - postgres
      - redis

  # --- BOUNDED CONTEXT SERVICES ---
  repo-service:
    build:
      context: .
      dockerfile: ./repo_service/Dockerfile
    container_name: devops_repo_service
    ports:
      - "8010:8010"
    depends_on:
      - postgres

  agent-service:
    build:
      context: .
      dockerfile: ./agent_service/Dockerfile
    container_name: devops_agent_service
    ports:
      - "8020:8020"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - redis

  deployment-service:
    build:
      context: .
      dockerfile: ./deployment_service/Dockerfile
    container_name: devops_celery_worker
    ports:
      # Internal evidence API (GET /api/internal/deployments/{run_id}) consumed
      # by incident-service; never publish outside the compose network in prod.
      - "8030:8030"
    command:
      - sh
      - -c
      - >
        celery -A deployment_service.infrastructure.celery.tasks.celery_app worker --loglevel=info &
        exec uvicorn deployment_service.main:app --host 0.0.0.0 --port 8030
    environment:
      - REDIS_HOST=redis
      # Cluster execution stays disabled unless explicitly enabled.
      - DEPLOYMENT_EXECUTION_ENABLED=${DEPLOYMENT_EXECUTION_ENABLED:-false}
    depends_on:
      - redis

  monitoring-service:
    build:
      context: .
      dockerfile: ./monitoring_service/Dockerfile
    container_name: devops_monitoring_service
    ports:
      - "8040:8040"
    depends_on:
      - postgres

  incident-service:
    build:
      context: .
      dockerfile: ./incident_service/Dockerfile
    container_name: devops_incident_service
    ports:
      - "8050:8050"
    environment:
      - GITHUB_OAUTH_TOKEN=${GITHUB_OAUTH_TOKEN:-}
      # Enables HMAC verification of inbound Sentry webhooks
      - SENTRY_WEBHOOK_SECRET=${SENTRY_WEBHOOK_SECRET:-}
      - AGENT_SERVICE_URL=http://agent-service:8020
      - DEPLOYMENT_SERVICE_URL=http://deployment-service:8030
      - INCIDENT_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/devops_prod
    depends_on:
      - postgres

  # Redis Streams consumer for monitoring threshold events
  # (event-bus defaults live in redis_incident_consumer.py)
  incident-event-worker:
    build:
      context: .
      dockerfile: ./incident_service/Dockerfile
    container_name: devops_incident_event_worker
    command: ["python", "-m", "incident_service.worker"]
    environment:
      - INCIDENT_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/devops_prod
      - EVENT_BUS_REDIS_URL=redis://redis:6379/0
      - EVENT_BUS_STREAM=devops:events
      - INCIDENT_EVENT_GROUP=incident-service
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
