# =============================================================================
# LEGACY / QUARANTINED stack — NOT the Phase 8.7-D.1 production path.
# =============================================================================
# Do NOT use this file for the D1 analysis stack. The canonical D1 path is
# `docker-compose.yml` (gateway + agent + shared Redis). This file preserves
# the older broad stack (postgres / redis / qdrant / celery worker) for
# reference only.
#
# * The `celery-worker` service references `./deployment_service/Dockerfile`
#   (Phase 8.8A path update — the package was migrated from the hyphenated
#   `deployment-service/` namespace). This legacy stack remains QUARANTINED
#   and is NOT the canonical D1 stack: the deployment service itself is
#   part of the canonical `docker-compose.yml` now, with its own security
#   contract (fail-closed execution, no host port exposure). Do not use
#   this file for the D1 path. `docker compose config` will flag it if
#   you try to build this legacy file.
# * The legacy stack exposes data stores to the host and used a hard-coded
#   database password; the password is now externally supplied (no committed
#   secret value).
# =============================================================================
version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: devops_postgres
    environment:
      POSTGRES_USER: postgres
      # Externally supplied — no committed secret value (hard-coded password
      # removed in Phase 8.7-D.1).
      POSTGRES_PASSWORD: ${LEGACY_POSTGRES_PASSWORD:?LEGACY_POSTGRES_PASSWORD must be set for the legacy stack}
      POSTGRES_DB: devops_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devops_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: devops_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: devops_api_gateway
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set — see devops-ai-platform/SECURITY.md}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN must be set — see devops-ai-platform/SECURITY.md}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
    depends_on:
      - agent-service
      - postgres
      - redis

  agent-service:
    build:
      context: .
      dockerfile: ./agent-service/Dockerfile
    container_name: devops_agent_service
    expose:
      - "8020"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY must be set for live analysis}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN:?AGENT_INTERNAL_TOKEN must be set — see devops-ai-platform/SECURITY.md}
    depends_on:
      - redis

  celery-worker:
    build:
      context: .
      dockerfile: ./deployment_service/Dockerfile
    container_name: devops_celery_worker
    command: celery -A deployment_service.infrastructure.celery.tasks.celery_app worker --loglevel=info
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

volumes:
  postgres_data:
