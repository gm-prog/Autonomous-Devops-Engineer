name: CI

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app

  platform-services:
    name: Platform service checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - repo-service
          - agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install service dependencies
        working-directory: devops-ai-platform/${{ matrix.service }}
        run: python -m pip install -r requirements.txt
      - name: Compile service
        working-directory: devops-ai-platform/${{ matrix.service }}
        run: python -m compileall -q .

  deployment-service:
    name: Deployment service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: devops-ai-platform/deployment-service
        run: python -m pip install -r requirements.txt
      - name: Compile deployment service
        working-directory: devops-ai-platform/deployment-service
        run: python -m compileall -q .
      - name: Run deployment service tests
        working-directory: devops-ai-platform/deployment-service
        run: PYTHONPATH=. pytest -q

  monitoring-service:
    name: Monitoring service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile monitoring service
        working-directory: devops-ai-platform/monitoring-service
        run: python -m compileall -q .
      - name: Run Prometheus adapter tests
        working-directory: devops-ai-platform/monitoring-service
        run: python -m unittest infrastructure.prometheus.test_scraper_client infrastructure.prometheus.test_live_metrics -v

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f devops-ai-platform/docker-compose.yml config

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Run unit tests
        run: gradle test
