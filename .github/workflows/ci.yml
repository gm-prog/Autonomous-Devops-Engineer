name: CI

on:
  push:
    branches: [ main, "dev/**", "arena/**", "integration/**" ]
  pull_request:

permissions:
  contents: read

# Phase 8.7-C / 8.7-D.1: mandatory security AND runtime-hardening gates.
#
# * A failed security invariant fails CI: no continue-on-error, no optional
#   security step, no condition that can skip a security check.
# * Action versions are pinned to the CURRENT (non-deprecated) majors so no
#   Node deprecation warnings are emitted (verified against the GitHub API on
#   2026-10-08): checkout@v7, setup-python@v7, setup-java@v6,
#   upload-artifact@v7, android-actions/setup-android@v4.
# * NO real provider secret is used in this workflow. Dummy values are used
#   only to satisfy the compose file's required-variable substitution; they
#   are not credentials and are never echoed.
# * Persisted artifacts are reports and runtime logs only — never secrets.

jobs:
  security-integrity:
    name: Phase 8.7-C/D.1 focused security suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: devops-ai-platform/requirements-test.txt
      - name: Install security test dependencies
        run: pip install --require-hashes -r requirements-test.txt

      - name: JWT fail-closed contract (Defect C)
        run: python -m pytest tests/test_jwt_secret_policy.py -v

      - name: Gateway control-plane authorization + dispatch removal (Defect A)
        run: python -m pytest tests/test_gateway_control_plane.py -v

      - name: Telemetry trust boundary — HMAC, replay, tamper, no side effects (Defect A)
        run: python -m pytest tests/test_telemetry_ingestion_trust.py -v

      - name: Gemini analysis lifecycle, budget, rate limit, structured contract
        run: python -m pytest tests/test_gemini_analysis_path.py -v

      - name: Analysis route rate limiting (burst, isolation, malformed identity, fail-closed)
        run: python -m pytest tests/test_analysis_rate_limiting.py -v

      - name: Adversarial mutations — weakening each control must turn the suite red
        run: python -m pytest tests/test_security_mutations.py -v

      - name: Full Phase 8.7-C/D.1 security suite (evidence)
        # Phase 8.8A: the ported deployment slice's tests are part of the
        # full-suite evidence (the gate at the final commit covers them).
        run: |
          set -euo pipefail
          python -m pytest tests/ deployment_service/tests -q --junitxml=security-tests.xml 2>&1 | tee security-tests.txt

      - name: Publish security test evidence
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Phase 8.7-C/D.1 security suites'
            echo '```'
            tail -5 security-tests.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-tests-evidence
          path: devops-ai-platform/security-tests.xml
          if-no-files-found: warn

  android-unit-tests:
    name: Android unit tests + debug build (real Gradle toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # JDK 21: AGP 9.x supports 17+, and the Robolectric tests target
          # SDK 36, whose android-all jars are Java 21 bytecode — they cannot
          # load under JDK 17 (Phase 8.7-D.1-CORRECTION, CI evidence
          # run 37825860227).
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Gradle 9.3.1 (pinned to the AGP 9.1.1 documented minimum, official page 2026-10-08)
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-9.3.1/bin" >> "$GITHUB_PATH"
          # Phase 8.7-D.1-CORRECTION-2 (P2): verify the pinned executable
          # by ABSOLUTE PATH. $GITHUB_PATH only takes effect in LATER
          # steps, so a bare `gradle --version` here would show the
          # runner's preinstalled Gradle and misrepresent the toolchain.
          echo "== pinned Gradle (absolute path, this step) =="
          /opt/gradle/gradle-9.3.1/bin/gradle --version
      - name: Generate CI-only debug keystore (standard androiddebugkey; gitignored, not a secret)
        run: |
          set -euo pipefail
          keytool -genkeypair -v -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -keystore debug.keystore
      # Phase 8.7-D.1-CORRECTION-2 (P2): test and build invoke the SAME
      # pinned executable by absolute path — the log therefore proves the
      # exact toolchain that ran (no reliance on PATH resolution).
      - name: Unit tests (AnalysisUrlPolicyTest, GeminiClientSecretPolicyTest, Robolectric)
        run: |
          set -o pipefail
          echo "== toolchain under test (same executable as the verified install) =="
          readlink -f /opt/gradle/gradle-9.3.1/bin/gradle
          /opt/gradle/gradle-9.3.1/bin/gradle :app:testDebugUnitTest --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/android-unit-tests.txt"
      - name: Debug APK build (the artifact the URL policy governs)
        run: |
          set -o pipefail
          /opt/gradle/gradle-9.3.1/bin/gradle :app:assembleDebug --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/android-assemble-debug.txt"
      # Evidence surfacing ONLY: on failure, a compact error digest is
      # written to (a) the step summary and (b) a run annotation (both
      # readable in the run UI and via the GitHub API — the raw log blob
      # storage is not reachable from the correction environment). The job
      # still fails on the Gradle exit code — nothing is masked.
      - name: Surface Gradle failure digest (summary + annotation)
        if: failure()
        run: |
          DIGEST=""
          for f in "$GITHUB_WORKSPACE/android-unit-tests.txt" "$GITHUB_WORKSPACE/android-assemble-debug.txt"; do
            if [ -f "$f" ]; then
              DIGEST="$DIGEST
              ### $f ($(wc -l < "$f") lines)
              $(grep -n -E "^e: |error: |FAILURE:|What went wrong|Caused by:|> Task .* FAILED|Out of memory|Killed" "$f" | head -25)
              --- tail ---
              $(tail -n 40 "$f")
              "
            else
              DIGEST="$DIGEST
              ### $f MISSING
              "
            fi
          done
          {
            echo "## Gradle failure digest"
            echo '```text'
            pwd
            ls -la "$GITHUB_WORKSPACE" | grep -E "\.txt" || true
            free -m || true
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # Run annotation (API-readable; workflow-command payload limit is
          # 65535 chars — keep it compact but complete for the error block).
          EXCERPT=$(printf '%s' "$DIGEST" | tr '\n' ' ' | head -c 4000)
          echo "::error title=Gradle failure digest (Android job)::$EXCERPT" || true
          for f in "$GITHUB_WORKSPACE/android-unit-tests.txt" "$GITHUB_WORKSPACE/android-assemble-debug.txt"; do
            if [ -f "$f" ]; then
              EXTRA=$(grep -n -A4 -E "kotlin.sourceSets DSL|What went wrong|Caused by" "$f" | head -30 | tr '\n' ' ' | head -c 3000)
              if [ -n "$EXTRA" ]; then
                echo "::error title=Gradle error block (Android job)::$EXTRA" || true
              fi
            fi
          done
      - name: Publish Android test reports (no secrets)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: app/build/reports
          if-no-files-found: warn

  android-secret-guards:
    name: Phase 8.7-C/D.1 Android embedded-secret + transport-policy static guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: devops-ai-platform/requirements-test.txt
      - name: Install security test dependencies
        run: pip install --require-hashes -r requirements-test.txt

      - name: Android secret guards over the actual repository source (Defect B)
        run: python -m pytest tests/test_android_secret_guards.py -v

      - name: Standalone structural guard runner — android surface (incl. A8 transport policy)
        run: |
          set -euo pipefail
          PYTHONPATH=. python -c "from pathlib import Path; from security_guards import android_check; v = android_check(Path.cwd().resolve().parents[0]); [print('VIOLATION:', x) for x in v]; assert not v, 'Android secret guard failed'; print('android-gemini-secret guard: PASS')" | tee -a "$GITHUB_STEP_SUMMARY"

  structural-guards:
    name: Phase 8.7-C/D.1 structural security + runtime guards (all surfaces)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: devops-ai-platform/requirements-test.txt
      - name: Install security test dependencies
        run: pip install --require-hashes -r requirements-test.txt

      - name: All structural guards over the actual repository source
        # Exits non-zero on any violation: a failed security invariant fails CI.
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m security_guards | tee -a "$GITHUB_STEP_SUMMARY"

  redis-integration:
    name: Real-Redis integration tests (shared budget ledger + shared rate limiter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: devops-ai-platform/requirements-test.txt
      - name: Install test dependencies (authoritative contract incl. redis client)
        run: pip install --require-hashes -r devops-ai-platform/requirements-test.txt
      - name: Start a real Redis (digest-pinned)
        run: |
          set -euo pipefail
          docker run -d --name d1-redis -p 127.0.0.1:6379:6379 \
            redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
          for i in $(seq 1 15); do
            docker exec d1-redis redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec d1-redis redis-cli ping
      # Phase 8.7-D.1-CORRECTION-2 (P1-C): the live-store steps are
      # FAIL-CLOSED. REDIS_INTEGRATION_REQUIRED=true makes a missing or
      # unreachable Redis a HARD test failure instead of a silent skip —
      # the structural contract is enforced by the d1-runtime-contract
      # guard (removing either env var turns CI red; mutation M24).
      - name: Integration tests against the live store
        working-directory: devops-ai-platform
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          REDIS_INTEGRATION_REQUIRED: "true"
        run: |
          set -euo pipefail
          python -m pytest tests/test_redis_integration.py -v 2>&1 | tee redis-integration.txt
      - name: Mutation suite against the live store (M19/M22 behavioral proofs — weakened finalize script double-counts; pre-provider probe bypass wedges the breaker, both on the real code paths)
        working-directory: devops-ai-platform
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          REDIS_INTEGRATION_REQUIRED: "true"
        run: |
          set -euo pipefail
          python -m pytest tests/test_security_mutations.py -v 2>&1 | tee redis-mutations.txt
      - name: Publish Redis integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redis-integration-evidence
          path: |
            devops-ai-platform/redis-integration.txt
            devops-ai-platform/redis-mutations.txt
          if-no-files-found: warn
      - name: Tear down Redis
        if: always()
        run: docker rm -f d1-redis || true

  compose-runtime:
    name: Canonical compose — config, image builds, boot/readiness smoke
    runs-on: ubuntu-latest
    env:
      # DUMMY values only: satisfy the compose file's required-variable
      # substitution (${VAR:?}). Not real credentials; never echoed.
      JWT_SECRET: ci-dummy-jwt-secret-not-a-real-secret
      AGENT_INTERNAL_TOKEN: ci-dummy-internal-token-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: devops-ai-platform/requirements-test.txt
      - name: Install test dependencies (authoritative contract incl. pyyaml)
        run: pip install --require-hashes -r devops-ai-platform/requirements-test.txt

      - name: Canonical compose config (structure + required variables)
        working-directory: devops-ai-platform
        run: docker compose config --quiet

      - name: Build gateway + agent images (digest-pinned bases)
        working-directory: devops-ai-platform
        run: docker compose build api-gateway agent-service

      - name: Boot the canonical stack (NO real provider credentials)
        working-directory: devops-ai-platform
        env:
          GEMINI_API_KEY: "" # deliberately absent: the agent must fail closed
        run: |
          set -euo pipefail
          docker compose up -d
          docker compose ps

      - name: Readiness + gateway->agent connectivity + truthful fail-closed
        working-directory: devops-ai-platform
        run: |
          set -euo pipefail
          # 1) Gateway readiness (proves the gateway depends on healthy redis
          #    and serves /api/v1/health).
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && break
            if [ "$i" -eq 30 ]; then docker compose ps; docker compose logs; exit 1; fi
            sleep 2
          done
          echo "gateway /api/v1/health:"
          curl -fsS http://127.0.0.1:8000/api/v1/health; echo

          # 2) Agent reachable through the COMPOSE NETWORK (never via host).
          docker compose exec -T api-gateway python -c \
            "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://agent-service:8020/health', timeout=5).status == 200 else 1)"
          echo "agent /health reachable via compose network: OK"

          # 3) The agent port must NOT be published on the host.
          if curl -fsS --max-time 3 http://127.0.0.1:8020/health >/dev/null 2>&1; then
            echo "FAIL: agent-service port 8020 is reachable on the host"; exit 1
          fi
          echo "agent port 8020 not host-exposed: OK"

          # 4) Truthful fail-closed: an authenticated analysis request with
          #    NO provider credentials must be a typed 503 — never a fake
          #    success and never a crash.
          # A VALID analysis role (the authorization matrix is operator /
          # DevOpsLead / ClusterAdmin / Developer) so the request reaches
          # the agent and exercises the intended fail-closed path:
          #   valid JWT -> valid role -> rate limiter -> gateway->agent ->
          #   Gemini key absent -> 503 (never a fabricated 200).
          TOKEN=$(docker compose exec -T api-gateway python -c \
            "import os; from api_gateway.core.auth import create_access_token; print(create_access_token('ci-smoke-user', ['Developer'], os.environ['JWT_SECRET']))")
          CODE=$(curl -s -o /tmp/analysis.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"repo_name":"smoke","repo_url":"https://github.com/o/r.git","framework":"FastAPI","technology":"Python 3.12"}' \
            http://127.0.0.1:8000/api/v1/repository/analyze)
          echo "analysis HTTP status without GEMINI_API_KEY: $CODE"
          cat /tmp/analysis.json; echo
          [ "$CODE" = "503" ] || { echo "FAIL: expected truthful 503 fail-closed, got $CODE"; exit 1; }

      - name: Collect runtime logs (stack ran without provider credentials; nothing secret is logged)
        if: always()
        working-directory: devops-ai-platform
        run: |
          set -euo pipefail
          docker compose ps > d1-compose-ps.txt 2>&1 || true
          docker compose logs --no-color > d1-boot-logs.txt 2>&1 || true

      - name: Publish compose boot evidence (reports/logs only, no secrets)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-compose-boot-evidence
          path: |
            devops-ai-platform/d1-compose-ps.txt
            devops-ai-platform/d1-boot-logs.txt
          if-no-files-found: warn

      - name: Tear down
        if: always()
        working-directory: devops-ai-platform
        run: docker compose down --remove-orphans || true

  # =======================================================================
  # Phase 8.8A — deployment execution trust-boundary gates
  # =======================================================================
  # Added by the selective forward-port of the sandboxed deployment slice
  # from candidate head 029ab490 (PR #12/#13) onto the 4f2b1ba security
  # baseline. Hand-merged (NOT the PR's workflow):
  #   * action pins match this file (checkout@v7 / setup-python@v7 /
  #     upload-artifact@v7);
  #   * installs use the sanctioned hash-pinned TEST lock
  #     (requirements-test.txt --require-hashes) — the candidate's broad
  #     `requirements.txt + pytest` install pattern was NOT ported;
  #   * E2E_BASE_COMMIT is the commit under test (evidence provenance),
  #     not a hard-coded historical SHA;
  #   * E2E images/tools come only from the committed pin files
  #     (e2e/pinned-images.txt, e2e/pinned-kubectl.txt);
  #   * Kind clusters are disposable and torn down; no live user cluster,
  #     no cloud account, no production credentials in any of these jobs;
  #   * artifacts are sanitized evidence JSON + text reports only.
  # All six pre-existing Phase 8.7-C/D.1 jobs above are unchanged.

  terraform-trust-boundary:
    name: Phase 8.5-A terraform execution trust boundary
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements-test.txt }
      - name: Install security test dependencies (hash-pinned test lock)
        run: pip install --require-hashes -r requirements-test.txt
      - name: Terraform sandbox policy, runner and fail-closed semantics
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest deployment_service/tests/test_terraform_trust_boundary.py \
            -q --junitxml=terraform-boundary.xml
          python scripts/junit_summary.py terraform-boundary.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Approval-integrity and plan-artifact safety
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest \
            deployment_service/tests/test_terraform_approval_integrity.py \
            -q --junitxml=terraform-approval.xml
          python scripts/junit_summary.py terraform-approval.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Assert no host terraform execution path exists (AST)
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          # AST guard across the whole execution-authority surface. It
          # permits the trusted adapter to launch a container runtime and
          # forbids terraform/shell execution anywhere.
          python scripts/assert_no_host_terraform_execution.py \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mutation probes (the security tests must actually bite)
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          # Deliberately weakens each control in an isolated copy of the
          # tree and fails if the suite stays green.
          python scripts/mutation_probe_terraform_boundary.py \
            | tee -a "$GITHUB_STEP_SUMMARY"

  terraform-sandbox-container-e2e:
    name: Phase 8.5-A containerized deployment-service E2E
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5001:5000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements-test.txt }
      - name: Install security test dependencies (hash-pinned test lock)
        run: pip install --require-hashes -r requirements-test.txt
      - name: Record runtime prerequisites
        run: |
          set -euo pipefail
          docker --version
          docker info --format 'daemon: {{.ServerVersion}}'
      - name: Validate the E2E compose topology
        working-directory: .
        run: |
          set -euo pipefail
          # The authoritative live topology is the E2E overlay, so validate
          # THAT, not only the default compose file. External image inputs
          # come from the committed digest pins; the terraform sandbox image
          # is supplied as a syntactically valid placeholder because this
          # step renders configuration and pulls nothing.
          PINS=devops-ai-platform/e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=devops-ai-platform python3 -m e2e.image_pins "$PINS" --refs)
          export JWT_SECRET=compose-config-validation-only
          AGENT_INTERNAL_TOKEN=compose-config-validation-only
          ZERO=$(printf '0%.0s' $(seq 64))
          export TERRAFORM_SANDBOX_IMAGE="placeholder@sha256:${ZERO}"
          docker compose \
            -f devops-ai-platform/docker-compose.yml \
            -f docker-compose.e2e.yml config >/dev/null
          echo "E2E compose topology is valid" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Containerized deployment-service trust boundary proof
        run: |
          set -euo pipefail
          # Every external image comes from the committed digest pins, so
          # this workflow text carries no hand-written digest and no tag.
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          # Evidence provenance: the commit under test, not a fixed SHA.
          export E2E_BASE_COMMIT="${GITHUB_SHA:0:7}"
          python e2e/terraform_sandbox_container_e2e.py \
            --registry localhost:5001 \
            --base-image "$E2E_PYTHON_BASE_IMAGE" \
            --redis-image "$E2E_REDIS_IMAGE" \
            --terraform-version 1.9.8 \
            --workspace-root /tmp/ares-e2e-tf-workspaces \
            --evidence terraform-container-e2e-evidence.json
      - name: Publish evidence
        if: always()
        run: |
          set -euo pipefail
          if [ -f terraform-container-e2e-evidence.json ]; then
            {
              echo '### Containerized deployment-service E2E evidence'
              echo '```json'
              cat terraform-container-e2e-evidence.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: terraform-container-e2e-evidence
          path: devops-ai-platform/terraform-container-e2e-evidence.json
          if-no-files-found: warn

  kubernetes-trust-boundary:
    name: Phase 8.6-A Kubernetes trust boundary (unit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements-test.txt }
      - name: Install security test dependencies (hash-pinned test lock)
        run: pip install --require-hashes -r requirements-test.txt
      - name: Kubernetes trust-boundary suite
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest \
            deployment_service/tests/test_kubernetes_trust_boundary.py \
            -q --no-header | tee k8s-unit.txt
      - name: No host kubectl execution path exists
        run: PYTHONPATH=. python scripts/assert_no_host_terraform_execution.py
      - name: Kubernetes bypass mutation probes
        run: |
          set -euo pipefail
          # A green security suite proves nothing on its own. Each probe
          # weakens one control on a throwaway copy and the suite must
          # notice. Any ESCAPED mutation fails this gate.
          PYTHONPATH=. python scripts/mutation_probe_kubernetes_boundary.py \
            | tee k8s-probes.txt
      - name: Publish unit evidence
        if: always()
        run: |
          set +e
          {
            echo '### Phase 8.6-A Kubernetes trust boundary (unit)'
            echo '```'
            tail -3 k8s-unit.txt 2>/dev/null
            tail -4 k8s-probes.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  kubernetes-kind-e2e:
    name: Phase 8.6-A live Kind Kubernetes E2E
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    services:
      # Present only so the locally built sandbox image acquires an
      # immutable repository digest. Nothing is pulled from the Internet.
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5001:5000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements-test.txt }
      - name: Install security test dependencies (hash-pinned test lock)
        run: pip install --require-hashes -r requirements-test.txt
      - name: Record runtime prerequisites
        run: |
          set -euo pipefail
          docker --version
          kind --version
          docker info --format 'daemon: {{.ServerVersion}}'
      - name: Fetch kubectl against the committed checksum
        run: |
          set -euo pipefail
          # dl.k8s.io publishes a bare digest with no filename, so the
          # checksum line is synthesised here and bound to the path we
          # actually downloaded. The expected digest is committed.
          read -r KVER KSHA < <(grep -v '^#' e2e/pinned-kubectl.txt | grep -v '^$' | head -1)
          echo "pinned kubectl $KVER"
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
          echo "${KSHA}  /tmp/kubectl" | sha256sum -c -
          chmod 0755 /tmp/kubectl
          echo "ARES_KUBECTL_BINARY=/tmp/kubectl" >> "$GITHUB_ENV"
          echo "ARES_KUBECTL_VERSION=${KVER}" >> "$GITHUB_ENV"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Live Kubernetes execution trust boundary proof
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          # the workload the Deployment actually runs, loaded into kind
          docker build -f e2e/workload/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" \
            -t ares-e2e-workload:local e2e/workload
          export E2E_BASE_COMMIT="${GITHUB_SHA:0:7}"
          PYTHONPATH=. python e2e/kubernetes_sandbox_kind_e2e.py \
            --node-image "$NODE_IMAGE" \
            --base-image "$E2E_PYTHON_BASE_IMAGE" \
            --workload-image ares-e2e-workload:local \
            --registry localhost:5001 \
            --kubectl-version "$ARES_KUBECTL_VERSION" \
            --evidence kubernetes-kind-e2e-evidence.json
      - name: Publish live evidence
        if: always()
        run: |
          set +e
          if [ -f kubernetes-kind-e2e-evidence.json ]; then
            {
              echo '### Phase 8.6-A Kind E2E evidence'
              echo '```json'
              cat kubernetes-kind-e2e-evidence.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kubernetes-kind-e2e-evidence
          path: devops-ai-platform/kubernetes-kind-e2e-evidence.json
          if-no-files-found: warn

  kubernetes-service-http-e2e:
    name: Phase 8.6-A real deployment-service to Kind E2E
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    services:
      # Present only so the locally built sandbox image acquires an
      # immutable repository digest. Nothing is pulled from the Internet.
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5002:5000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements-test.txt }
      - name: Install security test dependencies (hash-pinned test lock)
        run: pip install --require-hashes -r requirements-test.txt
      - name: Record runtime prerequisites
        run: |
          set -euo pipefail
          docker --version
          kind --version
          docker info --format 'daemon: {{.ServerVersion}}'
      - name: Fetch kubectl against the committed checksum
        run: |
          set -euo pipefail
          read -r KVER KSHA < <(grep -v '^#' e2e/pinned-kubectl.txt | grep -v '^$' | head -1)
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
          echo "${KSHA}  /tmp/kubectl" | sha256sum -c -
          chmod 0755 /tmp/kubectl
          echo "ARES_KUBECTL_BINARY=/tmp/kubectl" >> "$GITHUB_ENV"
          echo "ARES_KUBECTL_VERSION=${KVER}" >> "$GITHUB_ENV"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Start a real Kind cluster
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          kind create cluster --name ares-http-e2e \
            --image "$NODE_IMAGE" --config e2e/kind-config.yaml --wait 180s
          kubectl --context kind-ares-http-e2e get nodes -o wide
      - name: Real deployment-service to Kind proof over HTTP
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          # Artifact and raw-log retrieval is unreliable for this
          # repository, so the driver's output is mirrored into
          # annotations here. Without this a crash that happens before
          # the driver can write evidence is invisible.
          # the workload the Deployment actually runs, loaded into kind
          docker build -f e2e/workload/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" \
            -t ares-e2e-workload:local e2e/workload
          export E2E_BASE_COMMIT="${GITHUB_SHA:0:7}"
          set +e
          PYTHONPATH=. python e2e/kubernetes_service_http_kind_e2e.py \
            --cluster ares-http-e2e \
            --workload-image ares-e2e-workload:local \
            --base-image "$E2E_PYTHON_BASE_IMAGE" \
            --redis-image "$E2E_REDIS_IMAGE" \
            --registry localhost:5002 \
            --kubectl-version "$ARES_KUBECTL_VERSION" \
            --evidence kubernetes-http-e2e-evidence.json 2>&1 | tee /tmp/8.8-a.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" != "0" ]; then
            {
              echo '### Phase 8.6-A deployment-service→Kind output (tail)'
              echo '```'
              tail -c 12000 /tmp/8.8-a.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Only annotate from the shell when the driver produced no
            # evidence of its own; otherwise its compact result
            # annotation is the better record and should not be
            # crowded out of the ten-annotation budget.
            if [ ! -f kubernetes-http-e2e-evidence.json ]; then
              tail -n 8 /tmp/8.8-a.log | while IFS= read -r LINE; do
                printf '::error title=8.8-A crash::%s\n' "${LINE//$'\r'/}"
              done
            fi
          fi
          exit "$CODE"
      - name: Publish live evidence
        if: always()
        run: |
          set +e
          if [ -f kubernetes-http-e2e-evidence.json ]; then
            {
              echo '### Phase 8.6-A real deployment-service to Kind evidence'
              echo '```json'
              cat kubernetes-http-e2e-evidence.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/ares-k8s-http-service.log ]; then
            {
              echo '<details><summary>deployment-service logs</summary>'
              echo '```'
              tail -c 20000 /tmp/ares-k8s-http-service.log
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tear down the cluster
        if: always()
        run: kind delete cluster --name ares-http-e2e || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kubernetes-http-e2e-evidence
          path: devops-ai-platform/kubernetes-http-e2e-evidence.json
          if-no-files-found: warn
