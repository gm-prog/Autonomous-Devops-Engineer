name: CI

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app

  platform-services:
    name: Platform service checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - repo-service
          - agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install service dependencies
        working-directory: devops-ai-platform/${{ matrix.service }}
        run: python -m pip install -r requirements.txt
      - name: Compile service
        working-directory: devops-ai-platform/${{ matrix.service }}
        run: python -m compileall -q .
      - name: Run agent RCA tests
        if: matrix.service == 'agent-service'
        working-directory: devops-ai-platform/agent-service
        env:
          PYTHONPATH: .
        run: python -m unittest test_server -v

  incident-service:
    name: Incident service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install incident service dependencies
        working-directory: devops-ai-platform/incident-service
        run: python -m pip install -r requirements.txt
      - name: Compile incident service
        working-directory: devops-ai-platform/incident-service
        run: python -m compileall -q .
      - name: Run incident persistence and ingestion tests
        working-directory: devops-ai-platform/incident-service
        env:
          PYTHONPATH: .
        run: python -m unittest infrastructure.database.test_postgres_incident_repo application.event_handlers.test_on_metric_threshold_failed application.commands.test_attach_deployment_evidence infrastructure.deployment.test_deployment_evidence_collector application.services.test_rca_evidence_pack presentation.rest.test_rca_orchestration application.commands.test_apply_automated_fix infrastructure.source_provider.test_github_pr_client application.services.test_remediation_workspace_service application.services.test_remediation_patch_executor application.services.test_remediation_validation_runner application.services.test_remediation_commit_service application.services.test_remediation_orchestration_service -v

  deployment-service:
    name: Deployment service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: devops-ai-platform/deployment-service
        run: python -m pip install -r requirements.txt
      - name: Compile deployment service
        working-directory: devops-ai-platform/deployment-service
        run: python -m compileall -q .
      - name: Run deployment service tests
        working-directory: devops-ai-platform/deployment-service
        run: PYTHONPATH=. pytest -q

  monitoring-service:
    name: Monitoring service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile monitoring service
        working-directory: devops-ai-platform/monitoring-service
        run: python -m compileall -q .
      - name: Run monitoring service tests
        working-directory: devops-ai-platform/monitoring-service
        run: python -m unittest infrastructure.prometheus.test_scraper_client infrastructure.prometheus.test_live_metrics application.services.test_threshold_evaluator application.services.test_threshold_event_service -v

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f devops-ai-platform/docker-compose.yml config

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Run unit tests
        run: gradle test
