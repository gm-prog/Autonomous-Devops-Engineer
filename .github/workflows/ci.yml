name: CI

on:
  push:
    branches: [ main, "dev/**", "arena/**", "integration/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  platform-tests:
    name: Platform smoke tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ deployment_service/tests -v

  api-gateway:
    name: API gateway checks
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q api_gateway
      - run: python -m pytest api_gateway/tests -v
        env:
          PYTHONPATH: .
          JWT_SECRET: ci-gateway-secret

  incident-service:
    name: Incident, RCA and remediation checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: devops-ai-platform/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q incident_service
      - name: Run incident, RCA and remediation tests (35 modules)
        env:
          PYTHONPATH: .
        run: >-
          python -m unittest
          incident_service.infrastructure.database.test_postgres_incident_repo
          incident_service.application.event_handlers.test_on_metric_threshold_failed
          incident_service.application.commands.test_attach_deployment_evidence
          incident_service.infrastructure.deployment.test_deployment_evidence_collector
          incident_service.application.services.test_rca_evidence_pack
          incident_service.presentation.rest.test_rca_orchestration
          incident_service.application.commands.test_execution_authority
          incident_service.infrastructure.source_provider.test_github_pr_client
          incident_service.application.services.test_remediation_workspace_service
          incident_service.application.services.test_remediation_workspace_push
          incident_service.application.services.test_remediation_patch_executor
          incident_service.application.services.test_remediation_validation_runner
          incident_service.application.services.test_remediation_commit_service
          incident_service.application.services.test_remediation_orchestration_service
          incident_service.infrastructure.messaging.test_redis_incident_consumer
          incident_service.presentation.rest.test_remediation_authorization
          incident_service.application.services.test_remediation_e2e_boundary
          incident_service.application.commands.test_ingest_webhook_alert
          incident_service.application.services.test_rca_analyzer
          incident_service.application.services.test_proposal_generation_service
          incident_service.presentation.rest.test_proposal_endpoints
          incident_service.application.services.test_proposal_approval_service
          incident_service.application.services.test_operational_analytics
          incident_service.application.services.test_proposal_execution_service
          incident_service.presentation.rest.test_proposal_execution_endpoints
          incident_service.presentation.rest.test_analytics_endpoints
          incident_service.application.services.test_proposal_lease_coordination
          incident_service.application.services.test_proposal_execution_recovery
          incident_service.application.services.test_proposal_lease_liveness
          incident_service.application.services.test_progressive_release_gate_state
          incident_service.application.services.test_progressive_rollout_stage_state
          incident_service.application.services.test_rollout_plan_service
          incident_service.domain.test_incident_lifecycle
          incident_service.application.services.test_validation_sandbox
          incident_service.test_incident_concurrency
          -v

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config >/dev/null
        env: { JWT_SECRET: ci-gateway-secret }
      - run: docker compose -f devops-ai-platform/docker-compose.yml config >/dev/null
        env: { JWT_SECRET: ci-gateway-secret }

      # Phase 8.4.2-E1 — E2E Dockerfile build contract, proved by real
      # BuildKit (not by string matching). No secrets, no golden path, no
      # image execution: `--check` validates the Dockerfile + build options
      # and exits non-zero on any violation.
      - name: E2E Dockerfile build contract (BuildKit)
        shell: bash
        run: |
          set -euo pipefail
          EV=/tmp/e1-evidence.txt
          : > "$EV"
          {
            docker version --format 'docker server {{.Server.Version}}'
            docker buildx version
          } | tee -a "$EV"
          # the SAME committed digest the golden-path harness consumes
          PINS=devops-ai-platform/e2e/pinned-images.txt
          BASE="$(PYTHONPATH=devops-ai-platform python3 -m e2e.image_pins "$PINS" --refs \
            | awk '$1 == "E2E_PYTHON_BASE_IMAGE" { print $2 }')"
          printf '%s' "$BASE" \
            | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*@sha256:[0-9a-f]{64}$' || {
            echo "::error::committed base pin is not digest-addressed: ${BASE}"
            exit 1; }
          echo "committed BASE_IMAGE = ${BASE}" | tee -a "$EV"
          # (static) one shared definition of the contract: no Compose-only
          # `:?`/`?` form, no default, no fallback, no second base source,
          # pinned parser directives. Real BuildKit proves the syntax below.
          PYTHONPATH=devops-ai-platform python3 -m e2e.build_surfaces --validate \
            | tee -a "$EV"
          FAILURES=0
          CHECKED=0
          while read -r DF CTX <&3; do
            [ -n "${DF:-}" ] || continue
            CHECKED=$((CHECKED + 1))
            echo "::group::${DF}"
            POS=fail
            NEG=fail
            # (A) a valid digest build argument must pass real BuildKit
            if docker buildx build --check \
                 --build-arg BASE_IMAGE="$BASE" -f "$DF" "$CTX"; then
              POS=pass
            else
              echo "::error file=${DF}::BuildKit rejected the Dockerfile with a valid digest BASE_IMAGE"
              FAILURES=$((FAILURES + 1))
            fi
            # (B) omitting the build argument must fail closed — no
            # default, no tag fallback, no silent base image
            if docker buildx build --check -f "$DF" "$CTX" > /tmp/e1-neg.log 2>&1; then
              echo "::error file=${DF}::built without BASE_IMAGE — a default or fallback exists"
              FAILURES=$((FAILURES + 1))
            else
              NEG=rejected
              NEG_MSG="$(grep -aoiE 'base name[^"]{0,80}|ERROR: [^"]{0,90}' /tmp/e1-neg.log | head -n 1 || true)"
              [ -n "${NEG_SAMPLE:-}" ] || NEG_SAMPLE="$NEG_MSG"
              tail -n 3 /tmp/e1-neg.log
            fi
            echo "${DF}: digest-arg=${POS} no-arg=${NEG}" | tee -a "$EV"
            echo "::endgroup::"
          done 3< <(PYTHONPATH=devops-ai-platform python3 -m e2e.build_surfaces --plan)
          # (C) live mutation probe: the historical Phase 8.4.2-D form must
          # still be rejected by this BuildKit, so the gate above cannot
          # pass merely because the parser got more permissive.
          echo "::group::mutation probe — historical required-value form in FROM"
          MUT="$(mktemp -d)"
          {
            head -n 1 devops-ai-platform/e2e/sandbox/Dockerfile
            printf 'ARG BASE_IMAGE\n'
            printf 'FROM ${BASE_IMAGE:?BASE_IMAGE must be a name@sha256:<64hex> reference}\n'
            printf 'USER nobody\n'
          } > "$MUT/Dockerfile"
          if docker buildx build --check \
               --build-arg BASE_IMAGE="$BASE" -f "$MUT/Dockerfile" "$MUT" \
               > "$MUT/out.log" 2>&1; then
            echo "::error::BuildKit ACCEPTED the unsupported \${BASE_IMAGE:?…} form — regression gate assumption broken"
            FAILURES=$((FAILURES + 1))
          else
            cat "$MUT/out.log"
            MUT_MSG="$(grep -aoiE 'ERROR: [^"]{0,120}|unsupported modifier[^"]{0,60}' "$MUT/out.log" | head -n 1 || true)"
            echo "mutation probe rejected: ${MUT_MSG}" | tee -a "$EV"
          fi
          rm -rf "$MUT"
          echo "::endgroup::"
          echo "negative-check sample: ${NEG_SAMPLE:-none}" | tee -a "$EV"
          echo "surfaces checked=${CHECKED} failures=${FAILURES}" | tee -a "$EV"
          [ "$CHECKED" -eq 8 ] || { echo "::error::expected 8 E2E build surfaces"; exit 1; }
          [ "$FAILURES" -eq 0 ] || exit 1
          # publish the evidence where it survives log retention and is
          # readable through the API (job logs are not)
          cat "$EV" >> "$GITHUB_STEP_SUMMARY"
          MSG="$(python3 -c "import sys; print(open(sys.argv[1]).read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))" "$EV")"
          echo "::notice title=E2E Dockerfile BuildKit contract::${MSG}"
