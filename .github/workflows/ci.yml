  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config >/dev/null
        env: { JWT_SECRET: ci-gateway-secret }
      - run: docker compose -f devops-ai-platform/docker-compose.yml config >/dev/null
        env: { JWT_SECRET: ci-gateway-secret }

      # Phase 8.4.2-E1 — E2E Dockerfile build contract, proved by real
      # BuildKit (not by string matching). No secrets, no golden path, no
      # image execution: `--check` validates the Dockerfile + build options
      # and exits non-zero on any violation.
      - name: E2E Dockerfile build contract (BuildKit)
        shell: bash
        run: |
          set -euo pipefail
          EV=/tmp/e1-evidence.txt
          : > "$EV"
          {
            docker version --format 'docker server {{.Server.Version}}'
            docker buildx version
          } | tee -a "$EV"
          # the SAME committed digest the golden-path harness consumes
          PINS=devops-ai-platform/e2e/pinned-images.txt
          BASE="$(PYTHONPATH=devops-ai-platform python3 -m e2e.image_pins "$PINS" --refs \
            | awk '$1 == "E2E_PYTHON_BASE_IMAGE" { print $2 }')"
          printf '%s' "$BASE" \
            | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*@sha256:[0-9a-f]{64}$' || {
            echo "::error::committed base pin is not digest-addressed: ${BASE}"
            exit 1; }
          echo "committed BASE_IMAGE = ${BASE}" | tee -a "$EV"
          # (static) one shared definition of the contract: no Compose-only
          # `:?`/`?` form, no default, no fallback, no second base source,
          # pinned parser directives. Real BuildKit proves the syntax below.
          PYTHONPATH=devops-ai-platform python3 -m e2e.build_surfaces --validate \
            | tee -a "$EV"
          FAILURES=0
          CHECKED=0
          while read -r DF CTX <&3; do
            [ -n "${DF:-}" ] || continue
            CHECKED=$((CHECKED + 1))
            echo "::group::${DF}"
            POS=fail
            NEG=fail
            # (A) a valid digest build argument must pass real BuildKit
            if docker buildx build --check \
                 --build-arg BASE_IMAGE="$BASE" -f "$DF" "$CTX"; then
              POS=pass
            else
              echo "::error file=${DF}::BuildKit rejected the Dockerfile with a valid digest BASE_IMAGE"
              FAILURES=$((FAILURES + 1))
            fi
            # (B) omitting the build argument must fail closed — no
            # default, no tag fallback, no silent base image
            if docker buildx build --check -f "$DF" "$CTX" > /tmp/e1-neg.log 2>&1; then
              echo "::error file=${DF}::built without BASE_IMAGE — a default or fallback exists"
              FAILURES=$((FAILURES + 1))
            else
              NEG=rejected
              NEG_MSG="$(grep -aoiE 'base name[^"]{0,80}|ERROR: [^"]{0,90}' /tmp/e1-neg.log | head -n 1 || true)"
              [ -n "${NEG_SAMPLE:-}" ] || NEG_SAMPLE="$NEG_MSG"
              tail -n 3 /tmp/e1-neg.log
            fi
            echo "${DF}: digest-arg=${POS} no-arg=${NEG}" | tee -a "$EV"
            echo "::endgroup::"
          done 3< <(PYTHONPATH=devops-ai-platform python3 -m e2e.build_surfaces --plan)
          # (C) live mutation probe: the historical Phase 8.4.2-D form must
          # still be rejected by this BuildKit, so the gate above cannot
          # pass merely because the parser got more permissive.
          echo "::group::mutation probe — historical required-value form in FROM"
          MUT="$(mktemp -d)"
          {
            head -n 1 devops-ai-platform/e2e/sandbox/Dockerfile
            printf 'ARG BASE_IMAGE\n'
            printf 'FROM ${BASE_IMAGE:?BASE_IMAGE must be a name@sha256:<64hex> reference}\n'
            printf 'USER nobody\n'
          } > "$MUT/Dockerfile"
          if docker buildx build --check \
               --build-arg BASE_IMAGE="$BASE" -f "$MUT/Dockerfile" "$MUT" \
               > "$MUT/out.log" 2>&1; then
            echo "::error::BuildKit ACCEPTED the unsupported \${BASE_IMAGE:?…} form — regression gate assumption broken"
            FAILURES=$((FAILURES + 1))
          else
            cat "$MUT/out.log"
            MUT_MSG="$(grep -aoiE 'ERROR: [^"]{0,120}|unsupported modifier[^"]{0,60}' "$MUT/out.log" | head -n 1 || true)"
            echo "mutation probe rejected: ${MUT_MSG}" | tee -a "$EV"
          fi
          rm -rf "$MUT"
          echo "::endgroup::"
          echo "negative-check sample: ${NEG_SAMPLE:-none}" | tee -a "$EV"
          echo "surfaces checked=${CHECKED} failures=${FAILURES}" | tee -a "$EV"
          [ "$CHECKED" -eq 8 ] || { echo "::error::expected 8 E2E build surfaces"; exit 1; }
          [ "$FAILURES" -eq 0 ] || exit 1
          # publish the evidence where it survives log retention and is
          # readable through the API (job logs are not)
          cat "$EV" >> "$GITHUB_STEP_SUMMARY"
          MSG="$(python3 -c "import sys; print(open(sys.argv[1]).read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))" "$EV")"
          echo "::notice title=E2E Dockerfile BuildKit contract::${MSG}"

  audit-truth:
    name: Phase 8.4.2-F audit truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Topology auditing needs the complete object graph. A shallow
          # checkout grafts main to a parentless commit, which is exactly how
          # the false "no common ancestor" claim was produced (report §14).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest pyyaml
      - name: Verify the committed audit record against the full history
        run: |
          set -euo pipefail
          EV="$(mktemp)"
          # job logs are not readable through the API on this installation, so
          # the evidence is published as a step summary + annotation on every
          # exit path, success or failure
          publish() {
            rc=$?
            cat "$EV" >> "$GITHUB_STEP_SUMMARY" || true
            MSG="$(python3 -c "import sys; print(open(sys.argv[1]).read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))" "$EV" 2>/dev/null || echo "no evidence captured")"
            if [ "$rc" -eq 0 ]; then
              echo "::notice title=Phase 8.4.2-F audit truth::${MSG}"
            else
              echo "::error title=Phase 8.4.2-F audit truth FAILED::${MSG}"
            fi
            exit "$rc"
          }
          trap publish EXIT

          SHALLOW="$(git rev-parse --is-shallow-repository)"
          echo "shallow repository: ${SHALLOW}" | tee -a "$EV"
          [ "$SHALLOW" = "false" ] || { echo "full history required" | tee -a "$EV"; exit 1; }

          # every commit the record pins must be present, or the repository
          # level test would skip itself and prove nothing
          python - <<'PYCHK' | tee -a "$EV"
          import json, subprocess, sys
          rec = json.load(open("docs/phase-8.4.2-f-audit-facts.json"))
          missing = [r for e in rec["comparisons"] for r in (e["base"], e["head"])
                     if subprocess.run(["git", "cat-file", "-e", r + "^{commit}"],
                                       capture_output=True).returncode]
          print("audited head:", rec["audited_head"])
          print("pinned commits present:", "yes" if not missing else "NO: " + ",".join(missing))
          sys.exit(1 if missing else 0)
          PYCHK

          # 1. the guard must exit 0 and report PASS
          python scripts/audit_phase_8_4_2_f.py > guard.json
          RESULT="$(python -c "import json;print(json.load(open('guard.json'))['result'])")"
          echo "audit guard: ${RESULT} (exit 0)" | tee -a "$EV"
          [ "$RESULT" = "PASS" ] || exit 1

          # 2. the repository level test must EXECUTE here, never skip
          set +e
          python -m pytest devops-ai-platform/tests/test_audit_phase_8_4_2_f.py \
            -q --junitxml=audit-junit.xml
          PYTEST_RC=$?
          set -e
          echo "pytest exit code: ${PYTEST_RC}" | tee -a "$EV"
          python - <<'PYJUNIT' | tee -a "$EV"
          import os, sys, xml.etree.ElementTree as ET
          TARGET = "test_committed_audit_record_matches_this_repository"
          if not os.path.exists("audit-junit.xml"):
              print("junit report missing - pytest did not run to completion")
              sys.exit(1)
          cases = list(ET.parse("audit-junit.xml").getroot().iter("testcase"))
          hits = [c for c in cases if c.get("name") == TARGET]
          if len(hits) != 1:
              print(f"{TARGET}: NOT COLLECTED"); sys.exit(1)
          case = hits[0]
          state = ("SKIPPED" if case.findall("skipped")
                   else "FAILED" if case.findall("failure") or case.findall("error")
                   else "PASSED")
          skipped = sorted(c.get("name") for c in cases if c.findall("skipped"))
          failed = sorted(c.get("name") for c in cases
                          if c.findall("failure") or c.findall("error"))
          print(f"tests collected={len(cases)} failed={len(failed)} skipped={len(skipped)}")
          print(f"{TARGET}: EXECUTED and {state}")
          if skipped:
              print("skipped tests: " + ", ".join(skipped))
          if failed:
              print("failed tests: " + ", ".join(failed))
          sys.exit(0 if state == "PASSED" and not failed else 1)
          PYJUNIT
          [ "$PYTEST_RC" -eq 0 ] || exit 1

  operational-evidence:
    name: Phase 8.4.2-G.1 operational evidence contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: devops-ai-platform/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-subtests httpx
      - name: Domain, correlation, replay, persistence, API and adversarial tests
        env:
          PYTHONPATH: .
          # No vendor connector, no production credential, no live endpoint.
          # The evidence layer is stdlib-only and every fixture is a literal;
          # this secret is the same throwaway value the gateway job uses.
          JWT_SECRET: ci-gateway-secret
        run: |
          set -euo pipefail
          EV="$(mktemp)"
          # Job logs are not readable through the API on this installation, so
          # the evidence is published as a step summary + annotation on every
          # exit path, success or failure (same pattern as audit-truth).
          publish() {
            rc=$?
            cat "$EV" >> "$GITHUB_STEP_SUMMARY" || true
            MSG="$(python3 -c "import sys; print(open(sys.argv[1]).read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))" "$EV" 2>/dev/null || echo "no evidence captured")"
            if [ "$rc" -eq 0 ]; then
              echo "::notice title=Phase 8.4.2-G.1 evidence contract::${MSG}"
            else
              echo "::error title=Phase 8.4.2-G.1 evidence contract FAILED::${MSG}"
            fi
            exit "$rc"
          }
          trap publish EXIT

          set +e
          python -m pytest tests/test_operational_evidence_contract.py \
            api_gateway/tests/test_evidence_plane.py \
            -q --junitxml=evidence-results.xml
          PYTEST_RC=$?
          set -e
          echo "pytest exit: ${PYTEST_RC}" | tee -a "$EV"
          python scripts/junit_summary.py evidence-results.xml | tee -a "$EV"

          # Determinism has to hold ACROSS processes, not merely inside one
          # pytest session: dict, set and string hashing are per interpreter.
          HASHES=""
          for seed in 0 1 12345; do
            H="$(PYTHONHASHSEED="$seed" python scripts/evidence_pack_fingerprint.py)"
            echo "PYTHONHASHSEED=${seed} pack_hash=${H}" | tee -a "$EV"
            HASHES="${HASHES} ${H}"
          done
          UNIQUE="$(echo "$HASHES" | tr ' ' '\n' | grep -c . | tr -d ' ')"
          DISTINCT="$(echo "$HASHES" | tr ' ' '\n' | grep . | sort -u | wc -l | tr -d ' ')"
          echo "fingerprint runs: ${UNIQUE}, distinct hashes: ${DISTINCT}" | tee -a "$EV"
          [ "$DISTINCT" = "1" ] || { echo "FAIL non-deterministic pack hash" | tee -a "$EV"; exit 1; }

          # the conflicting-SHA variant must stay deterministic too, and must
          # not silently resolve to one of the two claims
          python scripts/evidence_pack_fingerprint.py --conflict --json > conflict.json
          python scripts/evidence_assert_conflict.py conflict.json | tee -a "$EV"

          [ "$PYTEST_RC" -eq 0 ] || exit 1
