name: CI

on:
  push:
    branches: [ main, "dev/**", "arena/**", "integration/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  platform-tests:
    name: Platform smoke tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ deployment_service/tests -v

  api-gateway:
    name: API gateway checks
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q api_gateway
      - run: python -m pytest api_gateway/tests -v
        env:
          PYTHONPATH: .
          JWT_SECRET: ci-gateway-secret

  incident-service:
    name: Incident, RCA and remediation checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: devops-ai-platform/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q incident_service
      - name: Run incident, RCA and remediation tests (17 modules)
        env:
          PYTHONPATH: .
        run: >-
          python -m unittest
          incident_service.infrastructure.database.test_postgres_incident_repo
          incident_service.application.event_handlers.test_on_metric_threshold_failed
          incident_service.application.commands.test_attach_deployment_evidence
          incident_service.infrastructure.deployment.test_deployment_evidence_collector
          incident_service.application.services.test_rca_evidence_pack
          incident_service.presentation.rest.test_rca_orchestration
          incident_service.application.commands.test_apply_automated_fix
          incident_service.infrastructure.source_provider.test_github_pr_client
          incident_service.application.services.test_remediation_workspace_service
          incident_service.application.services.test_remediation_workspace_push
          incident_service.application.services.test_remediation_patch_executor
          incident_service.application.services.test_remediation_validation_runner
          incident_service.application.services.test_remediation_commit_service
          incident_service.application.services.test_remediation_orchestration_service
          incident_service.infrastructure.messaging.test_redis_incident_consumer
          incident_service.presentation.rest.test_remediation_authorization
          incident_service.application.services.test_remediation_e2e_boundary
          -v

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml config >/dev/null
        env: { JWT_SECRET: ci-gateway-secret }
      - run: docker compose -f devops-ai-platform/docker-compose.yml config >/dev/null
        env: { JWT_SECRET: ci-gateway-secret }
