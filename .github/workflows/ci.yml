name: CI

on:
  push:
    branches: [ main, "dev/**", "arena/**", "integration/**" ]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  platform-tests:
    name: Platform smoke tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ deployment_service/tests -v

  terraform-trust-boundary:
    name: Phase 8.5-A terraform execution trust boundary
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - name: Terraform sandbox policy, runner and fail-closed semantics
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest deployment_service/tests/test_terraform_trust_boundary.py \
            -q --junitxml=terraform-boundary.xml
          python scripts/junit_summary.py terraform-boundary.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Approval-integrity and plan-artifact safety
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest \
            deployment_service/tests/test_terraform_approval_integrity.py \
            -q --junitxml=terraform-approval.xml
          python scripts/junit_summary.py terraform-approval.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Assert no host terraform execution path exists (AST)
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          # AST guard across the whole execution-authority surface. It
          # permits the trusted adapter to launch a container runtime and
          # forbids terraform/shell execution anywhere.
          python scripts/assert_no_host_terraform_execution.py \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mutation probes (the security tests must actually bite)
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          # Deliberately weakens each control in an isolated copy of the
          # tree and fails if the suite stays green.
          python scripts/mutation_probe_terraform_boundary.py \
            | tee -a "$GITHUB_STEP_SUMMARY"

  terraform-sandbox-container-e2e:
    name: Phase 8.5-A containerized deployment-service E2E
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    services:
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5001:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - name: Record runtime prerequisites
        run: |
          set -euo pipefail
          docker --version
          docker info --format 'daemon: {{.ServerVersion}}'
      - name: Validate the E2E compose topology
        working-directory: .
        run: |
          set -euo pipefail
          # The authoritative live topology is the E2E overlay, so validate
          # THAT, not only the default compose file. External image inputs
          # come from the committed digest pins; the two sandbox images are
          # supplied as syntactically valid placeholders because this step
          # renders configuration and pulls nothing.
          PINS=devops-ai-platform/e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=devops-ai-platform python3 -m e2e.image_pins "$PINS" --refs)
          export JWT_SECRET=compose-config-validation-only
          ZERO=$(printf '0%.0s' $(seq 64))
          export REMEDIATION_SANDBOX_IMAGE="placeholder@sha256:${ZERO}"
          export TERRAFORM_SANDBOX_IMAGE="placeholder@sha256:${ZERO}"
          docker compose \
            -f devops-ai-platform/docker-compose.yml \
            -f docker-compose.e2e.yml config >/dev/null
          echo "E2E compose topology is valid" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Containerized deployment-service trust boundary proof
        run: |
          set -euo pipefail
          # Every external image comes from the committed digest pins, so
          # this workflow text carries no hand-written digest and no tag.
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          export E2E_BASE_COMMIT=d4e87a5
          python e2e/terraform_sandbox_container_e2e.py \
            --registry localhost:5001 \
            --base-image "$E2E_PYTHON_BASE_IMAGE" \
            --redis-image "$E2E_REDIS_IMAGE" \
            --terraform-version 1.9.8 \
            --workspace-root /tmp/ares-e2e-tf-workspaces \
            --evidence terraform-container-e2e-evidence.json
      - name: Publish evidence
        if: always()
        run: |
          set -euo pipefail
          if [ -f terraform-container-e2e-evidence.json ]; then
            {
              echo '### Containerized deployment-service E2E evidence'
              echo '```json'
              cat terraform-container-e2e-evidence.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-container-e2e-evidence
          path: devops-ai-platform/terraform-container-e2e-evidence.json
          if-no-files-found: warn

  kubernetes-trust-boundary:
    name: Phase 8.6-A Kubernetes trust boundary (unit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt pytest pytest-subtests
      - name: Kubernetes trust-boundary suite
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest \
            deployment_service/tests/test_kubernetes_trust_boundary.py \
            -q --no-header | tee k8s-unit.txt
      - name: No host kubectl execution path exists
        run: PYTHONPATH=. python scripts/assert_no_host_terraform_execution.py
      - name: Kubernetes bypass mutation probes
        run: |
          set -euo pipefail
          # A green security suite proves nothing on its own. Each probe
          # weakens one control on a throwaway copy and the suite must
          # notice. Any ESCAPED mutation fails this gate.
          PYTHONPATH=. python scripts/mutation_probe_kubernetes_boundary.py \
            | tee k8s-probes.txt
      - name: Publish unit evidence
        if: always()
        run: |
          set +e
          {
            echo '### Phase 8.6-A Kubernetes trust boundary (unit)'
            echo '```'
            tail -3 k8s-unit.txt 2>/dev/null
            tail -4 k8s-probes.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  kubernetes-kind-e2e:
    name: Phase 8.6-A live Kind Kubernetes E2E
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    services:
      # Present only so the locally built sandbox image acquires an
      # immutable repository digest. Nothing is pulled from the Internet.
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5001:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Record runtime prerequisites
        run: |
          set -euo pipefail
          docker --version
          kind --version
          docker info --format 'daemon: {{.ServerVersion}}'
      - name: Fetch kubectl against the committed checksum
        run: |
          set -euo pipefail
          # dl.k8s.io publishes a bare digest with no filename, so the
          # checksum line is synthesised here and bound to the path we
          # actually downloaded. The expected digest is committed.
          read -r KVER KSHA < <(grep -v '^#' e2e/pinned-kubectl.txt | grep -v '^$' | head -1)
          echo "pinned kubectl $KVER"
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
          echo "${KSHA}  /tmp/kubectl" | sha256sum -c -
          chmod 0755 /tmp/kubectl
          echo "ARES_KUBECTL_BINARY=/tmp/kubectl" >> "$GITHUB_ENV"
          echo "ARES_KUBECTL_VERSION=${KVER}" >> "$GITHUB_ENV"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Live Kubernetes execution trust boundary proof
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          # the workload the Deployment actually runs, loaded into kind
          docker build -f e2e/workload/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" \
            -t ares-e2e-workload:local e2e/workload
          PYTHONPATH=. python e2e/kubernetes_sandbox_kind_e2e.py \
            --node-image "$NODE_IMAGE" \
            --base-image "$E2E_PYTHON_BASE_IMAGE" \
            --workload-image ares-e2e-workload:local \
            --registry localhost:5001 \
            --kubectl-version "$ARES_KUBECTL_VERSION" \
            --evidence kubernetes-kind-e2e-evidence.json
      - name: Publish live evidence
        if: always()
        run: |
          set +e
          if [ -f kubernetes-kind-e2e-evidence.json ]; then
            {
              echo '### Phase 8.6-A live Kind E2E evidence'
              echo '```json'
              cat kubernetes-kind-e2e-evidence.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        id: upload-kind-evidence
        if: always()
        with:
          name: kubernetes-kind-e2e-evidence
          path: |
            devops-ai-platform/kubernetes-kind-e2e-evidence.json
            devops-ai-platform/kubernetes-kind-e2e-evidence.json.sha256
          if-no-files-found: warn
      - name: Publish evidence provenance
        if: always()
        run: |
          set +e
          # The artifact id and the run/job identity only exist after the
          # upload, so they are published here rather than inside the
          # sealed evidence file (which cannot contain its own identifiers).
          DIGEST=$(cat kubernetes-kind-e2e-evidence.json.sha256 2>/dev/null)
          ARTIFACT_ID="${{ steps.upload-kind-evidence.outputs.artifact-id }}"
          {
            echo '### Phase 8.6-A live Kind E2E provenance'
            echo "- python_run_id: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "- job_key: ${{ github.job }}"
            echo "- artifact_id: ${ARTIFACT_ID}"
            echo "- evidence_digest: ${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=8.6-A Kind evidence provenance::run_id=%s attempt=%s job=%s artifact_id=%s digest=%s\n' \
            "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.job }}" \
            "${ARTIFACT_ID}" "${DIGEST}"

  kubernetes-service-http-e2e:
    name: Phase 8.6-A real deployment-service to Kind E2E
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    services:
      # Present only so the locally built sandbox image acquires an
      # immutable repository digest. Nothing is pulled from the Internet.
      registry:
        image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5002:5000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Record runtime prerequisites
        run: |
          set -euo pipefail
          docker --version
          kind --version
          docker info --format 'daemon: {{.ServerVersion}}'
      - name: Fetch kubectl against the committed checksum
        run: |
          set -euo pipefail
          read -r KVER KSHA < <(grep -v '^#' e2e/pinned-kubectl.txt | grep -v '^$' | head -1)
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
          echo "${KSHA}  /tmp/kubectl" | sha256sum -c -
          chmod 0755 /tmp/kubectl
          echo "ARES_KUBECTL_BINARY=/tmp/kubectl" >> "$GITHUB_ENV"
          echo "ARES_KUBECTL_VERSION=${KVER}" >> "$GITHUB_ENV"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Start a real Kind cluster
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          kind create cluster --name ares-http-e2e \
            --image "$NODE_IMAGE" --config e2e/kind-config.yaml --wait 180s
          kubectl --context kind-ares-http-e2e get nodes -o wide
      - name: Real deployment-service to Kind proof over HTTP
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          # Artifact and raw-log retrieval is unreliable for this
          # repository, so the driver's output is mirrored into
          # annotations here. Without this a crash that happens before
          # the driver can write evidence is invisible.
          # the workload the Deployment actually runs, loaded into kind
          docker build -f e2e/workload/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" \
            -t ares-e2e-workload:local e2e/workload
          set +e
          PYTHONPATH=. python e2e/kubernetes_service_http_kind_e2e.py \
            --cluster ares-http-e2e \
            --workload-image ares-e2e-workload:local \
            --base-image "$E2E_PYTHON_BASE_IMAGE" \
            --redis-image "$E2E_REDIS_IMAGE" \
            --registry localhost:5002 \
            --kubectl-version "$ARES_KUBECTL_VERSION" \
            --evidence kubernetes-http-e2e-evidence.json 2>&1 | tee /tmp/8.6-b.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" != "0" ]; then
            {
              echo '### Phase 8.6-A Workstream B output (tail)'
              echo '```'
              tail -c 12000 /tmp/8.6-b.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Only annotate from the shell when the driver produced no
            # evidence of its own; otherwise its compact result
            # annotation is the better record and should not be
            # crowded out of the ten-annotation budget.
            if [ ! -f kubernetes-http-e2e-evidence.json ]; then
              tail -n 8 /tmp/8.6-b.log | while IFS= read -r LINE; do
                printf '::error title=8.6-B crash::%s\n' "${LINE//$'\r'/}"
              done
            fi
          fi
          exit "$CODE"
      - name: Publish live evidence
        if: always()
        run: |
          set +e
          if [ -f kubernetes-http-e2e-evidence.json ]; then
            {
              echo '### Phase 8.6-A real deployment-service to Kind evidence'
              echo '```json'
              cat kubernetes-http-e2e-evidence.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/ares-k8s-http-service.log ]; then
            {
              echo '<details><summary>deployment-service logs</summary>'
              echo '```'
              tail -c 20000 /tmp/ares-k8s-http-service.log
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tear down the cluster
        if: always()
        run: kind delete cluster --name ares-http-e2e || true
      - uses: actions/upload-artifact@v4
        id: upload-http-evidence
        if: always()
        with:
          name: kubernetes-http-e2e-evidence
          path: |
            devops-ai-platform/kubernetes-http-e2e-evidence.json
            devops-ai-platform/kubernetes-http-e2e-evidence.json.sha256
          if-no-files-found: warn
      - name: Publish evidence provenance
        if: always()
        run: |
          set +e
          DIGEST=$(cat kubernetes-http-e2e-evidence.json.sha256 2>/dev/null)
          ARTIFACT_ID="${{ steps.upload-http-evidence.outputs.artifact-id }}"
          {
            echo '### Phase 8.6-A real service HTTP E2E provenance'
            echo "- python_run_id: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "- job_key: ${{ github.job }}"
            echo "- artifact_id: ${ARTIFACT_ID}"
            echo "- evidence_digest: ${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=8.6-B evidence provenance::run_id=%s attempt=%s job=%s artifact_id=%s digest=%s\n' \
            "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.job }}" \
            "${ARTIFACT_ID}" "${DIGEST}"

  kubernetes-traffic-topology-e2e:
    name: Phase 8.7-B.0 weighted traffic topology E2E
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Record runtime prerequisites
        run: |
          set -euo pipefail
          docker --version
          kind --version
          docker info --format 'daemon: {{.ServerVersion}}'
      - name: Fetch kubectl against the committed checksum
        run: |
          set -euo pipefail
          read -r KVER KSHA < <(grep -v '^#' e2e/pinned-kubectl.txt | grep -v '^$' | head -1)
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
          echo "${KSHA}  /tmp/kubectl" | sha256sum -c -
          chmod 0755 /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Start a real Kind cluster
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          kind create cluster --name ares-topology-e2e \
            --image "$NODE_IMAGE" --config e2e/kind-config.yaml --wait 180s
          kubectl --context kind-ares-topology-e2e get nodes -o wide
      # Every external byte this phase depends on is committed as a digest
      # in e2e/pinned-traffic-topology.txt (its own parser, fail closed).
      # Nothing resolves a tag, a branch or 'latest' here, and kubectl only
      # ever sees a file whose sha256 was verified against the pin.
      - name: Install the pinned Gateway API CRDs and Envoy Gateway
        run: |
          set -euo pipefail
          CTX=kind-ares-topology-e2e
          while read -r KEY URL PIN; do
            [ -n "${KEY:-}" ] || continue
            curl -fsSL -o "/tmp/${KEY}.yaml" "$URL"
            echo "${PIN#sha256:}  /tmp/${KEY}.yaml" | sha256sum -c -
          done < <(PYTHONPATH=. python3 -m e2e.traffic_topology_pins \
                     e2e/pinned-traffic-topology.txt --refs)
          for KEY in GATEWAY_API_CRDS_URL ENVOY_GATEWAY_CRDS_URL ENVOY_GATEWAY_INSTALL_URL; do
            printf '::notice title=8.7-B.0 pinned artifact::%s sha256=%s\n' \
              "$KEY" "$(sha256sum "/tmp/${KEY}.yaml" | cut -d' ' -f1)"
          done
          # Server-side apply: the Gateway API CRD schemas exceed the
          # client-side last-applied annotation limit, and it is idempotent.
          kubectl --context "$CTX" apply --server-side -f /tmp/GATEWAY_API_CRDS_URL.yaml
          kubectl --context "$CTX" wait --for=condition=Established --timeout=180s \
            crd/gatewayclasses.gateway.networking.k8s.io \
            crd/gateways.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io
          kubectl --context "$CTX" apply --server-side -f /tmp/ENVOY_GATEWAY_CRDS_URL.yaml
          kubectl --context "$CTX" apply --server-side -f /tmp/ENVOY_GATEWAY_INSTALL_URL.yaml
          # Re-apply the pinned Gateway API CRDs so what is on the cluster
          # is the pinned release even if the controller bundle shipped a
          # different copy (the driver re-checks the installed version).
          kubectl --context "$CTX" apply --server-side -f /tmp/GATEWAY_API_CRDS_URL.yaml
          kubectl --context "$CTX" -n envoy-gateway-system \
            wait --for=condition=Available --timeout=300s deployment/envoy-gateway
          kubectl --context "$CTX" -n envoy-gateway-system get deployments,pods -o wide
          kubectl --context "$CTX" get crd httproutes.gateway.networking.k8s.io \
            -o jsonpath='{.metadata.annotations.gateway\.networking\.k8s\.io/bundle-version}{"\n"}'
      - name: Real weighted stable/canary routing over the Envoy data plane
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          # The loop above reads from a process substitution, which cannot
          # fail the step by itself: the one build input this step depends
          # on is therefore checked explicitly instead of failing later as
          # an unset variable.
          if [ -z "${E2E_PYTHON_BASE_IMAGE:-}" ]; then
            printf '::error title=8.7-B.0 build input::%s\n' \
              'e2e/pinned-images.txt did not export E2E_PYTHON_BASE_IMAGE'
            exit 1
          fi
          # Artifact and raw-log retrieval is unreliable for this
          # repository, so EVERY failure below is mirrored into the step
          # summary and into ::error annotations. A build or load that
          # fails silently (or in under a second) is otherwise
          # undiagnosable, which is exactly how the first run of this job
          # was lost.
          build_image() {
            local tag="$1"; shift
            local logfile="/tmp/build-${tag%%:*}.log"
            local code=0
            docker build --progress=plain "$@" -t "$tag" >"$logfile" 2>&1 || code=$?
            tail -n 25 "$logfile"
            if [ "$code" != "0" ]; then
              printf '::error title=8.7-B.0 image build failed (%s)::exit %s: %s\n' \
                "$tag" "$code" "$(tail -n 1 "$logfile")"
              {
                echo "### Phase 8.7-B.0 image build failed: ${tag} (exit ${code})"
                echo '```'
                tail -c 6000 "$logfile"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
            fi
            printf '::notice title=8.7-B.0 image built::%s id=%s\n' \
              "$tag" "$(docker image inspect --format '{{.Id}}' "$tag")"
          }
          load_image() {
            local image="$1"
            local logfile="/tmp/load-${image%%:*}.log"
            local code=0
            kind load docker-image "$image" --name ares-topology-e2e \
              >"$logfile" 2>&1 || code=$?
            tail -n 10 "$logfile"
            if [ "$code" != "0" ]; then
              printf '::error title=8.7-B.0 image load failed (%s)::exit %s: %s\n' \
                "$image" "$code" "$(tail -n 1 "$logfile")"
              {
                echo "### Phase 8.7-B.0 image load failed: ${image} (exit ${code})"
                echo '```'
                tail -c 4000 "$logfile"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
            fi
          }
          # Two builds of ONE workload fixture with different tracks: the
          # stable and canary backends differ in image identity as well as
          # in Deployment, so "two real workloads" is observable.
          build_image ares-traffic-stable:local \
            -f e2e/traffic-topology/workload/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" --build-arg TRACK=stable \
            e2e/traffic-topology/workload
          build_image ares-traffic-canary:local \
            -f e2e/traffic-topology/workload/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" --build-arg TRACK=canary \
            e2e/traffic-topology/workload
          build_image ares-traffic-sampler:local \
            -f e2e/traffic-topology/sampler/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" \
            e2e/traffic-topology/sampler
          for IMAGE in ares-traffic-stable:local ares-traffic-canary:local \
                       ares-traffic-sampler:local; do
            load_image "$IMAGE"
          done
          # Artifact and raw-log retrieval is unreliable for this
          # repository, so the driver's output is mirrored into the step
          # summary and annotations here. Without this a crash before the
          # driver can seal evidence would be invisible.
          set +e
          PYTHONPATH=. python e2e/traffic_topology_kind_e2e.py \
            --cluster ares-topology-e2e \
            --stable-image ares-traffic-stable:local \
            --canary-image ares-traffic-canary:local \
            --sampler-image ares-traffic-sampler:local \
            --expected-commit "$GITHUB_SHA" \
            --gateway-api-version v1.4.1 \
            --envoy-gateway-version v1.6.7 \
            --destroy-cluster \
            --evidence traffic-topology-e2e.json 2>&1 | tee /tmp/8.7-b.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" != "0" ]; then
            {
              echo '### Phase 8.7-B.0 weighted traffic topology output (tail)'
              echo '```'
              tail -c 14000 /tmp/8.7-b.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ ! -f traffic-topology-e2e.json ]; then
              tail -n 8 /tmp/8.7-b.log | while IFS= read -r LINE; do
                printf '::error title=8.7-B.0 crash::%s\n' "${LINE//$'\r'/}"
              done
            fi
          fi
          exit "$CODE"
      - name: Publish live evidence
        if: always()
        run: |
          set +e
          if [ -f traffic-topology-e2e.json ]; then
            {
              echo '### Phase 8.7-B.0 weighted traffic topology evidence'
              echo '```json'
              cat traffic-topology-e2e.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tear down the cluster
        if: always()
        run: kind delete cluster --name ares-topology-e2e || true
      - uses: actions/upload-artifact@v4
        id: upload-traffic-topology-evidence
        if: always()
        with:
          name: traffic-topology-e2e-evidence
          path: |
            devops-ai-platform/traffic-topology-e2e.json
            devops-ai-platform/traffic-topology-e2e.json.sha256
          if-no-files-found: warn
      - name: Publish evidence provenance
        if: always()
        run: |
          set +e
          DIGEST=$(cat traffic-topology-e2e.json.sha256 2>/dev/null)
          ARTIFACT_ID="${{ steps.upload-traffic-topology-evidence.outputs.artifact-id }}"
          {
            echo '### Phase 8.7-B.0 weighted traffic topology provenance'
            echo "- python_run_id: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "- job_key: ${{ github.job }}"
            echo "- artifact_id: ${ARTIFACT_ID}"
            echo "- evidence_digest: ${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=8.7-B.0 evidence provenance::run_id=%s attempt=%s job=%s artifact_id=%s digest=%s\n' \
            "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.job }}" \
            "${ARTIFACT_ID}" "${DIGEST}"

  kubernetes-traffic-observation-e2e:
    name: Phase 8.7-B.1 traffic observation E2E
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: devops-ai-platform } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: devops-ai-platform/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Record runtime prerequisites
        run: |
          set -euo pipefail
          docker --version
          kind --version
          docker info --format 'daemon: {{.ServerVersion}}'
      - name: Fetch kubectl against the committed checksum
        run: |
          set -euo pipefail
          read -r KVER KSHA < <(grep -v '^#' e2e/pinned-kubectl.txt | grep -v '^$' | head -1)
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
          echo "${KSHA}  /tmp/kubectl" | sha256sum -c -
          chmod 0755 /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Start a real Kind cluster
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          kind create cluster --name ares-observation-e2e \
            --image "$NODE_IMAGE" --config e2e/kind-config.yaml --wait 180s
          kubectl --context kind-ares-observation-e2e get nodes -o wide
      # Every external byte this phase depends on is committed as a digest
      # in e2e/pinned-traffic-topology.txt (its own parser, fail closed).
      # Nothing resolves a tag, a branch or 'latest' here, and kubectl only
      # ever sees a file whose sha256 was verified against the pin.
      - name: Install the pinned Gateway API CRDs and Envoy Gateway
        run: |
          set -euo pipefail
          CTX=kind-ares-observation-e2e
          while read -r KEY URL PIN; do
            [ -n "${KEY:-}" ] || continue
            curl -fsSL -o "/tmp/${KEY}.yaml" "$URL"
            echo "${PIN#sha256:}  /tmp/${KEY}.yaml" | sha256sum -c -
          done < <(PYTHONPATH=. python3 -m e2e.traffic_topology_pins \
                     e2e/pinned-traffic-topology.txt --refs)
          for KEY in GATEWAY_API_CRDS_URL ENVOY_GATEWAY_CRDS_URL ENVOY_GATEWAY_INSTALL_URL; do
            printf '::notice title=8.7-B.1 pinned artifact::%s sha256=%s\n' \
              "$KEY" "$(sha256sum "/tmp/${KEY}.yaml" | cut -d' ' -f1)"
          done
          # Server-side apply: the Gateway API CRD schemas exceed the
          # client-side last-applied annotation limit, and it is idempotent.
          kubectl --context "$CTX" apply --server-side -f /tmp/GATEWAY_API_CRDS_URL.yaml
          kubectl --context "$CTX" wait --for=condition=Established --timeout=180s \
            crd/gatewayclasses.gateway.networking.k8s.io \
            crd/gateways.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io
          kubectl --context "$CTX" apply --server-side -f /tmp/ENVOY_GATEWAY_CRDS_URL.yaml
          kubectl --context "$CTX" apply --server-side -f /tmp/ENVOY_GATEWAY_INSTALL_URL.yaml
          # Re-apply the pinned Gateway API CRDs so what is on the cluster
          # is the pinned release even if the controller bundle shipped a
          # different copy (the driver re-checks the installed version).
          kubectl --context "$CTX" apply --server-side -f /tmp/GATEWAY_API_CRDS_URL.yaml
          kubectl --context "$CTX" -n envoy-gateway-system \
            wait --for=condition=Available --timeout=300s deployment/envoy-gateway
          kubectl --context "$CTX" -n envoy-gateway-system get deployments,pods -o wide
          kubectl --context "$CTX" get crd httproutes.gateway.networking.k8s.io \
            -o jsonpath='{.metadata.annotations.gateway\.networking\.k8s\.io/bundle-version}{"\n"}'
      - name: Real weighted stable/canary routing over the Envoy data plane
        run: |
          set -euo pipefail
          PINS=e2e/pinned-images.txt
          while read -r KEY REF; do
            [ -n "${KEY:-}" ] || continue
            export "$KEY=$REF"
          done < <(PYTHONPATH=. python3 -m e2e.image_pins "$PINS" --refs)
          # The loop above reads from a process substitution, which cannot
          # fail the step by itself: the one build input this step depends
          # on is therefore checked explicitly instead of failing later as
          # an unset variable.
          if [ -z "${E2E_PYTHON_BASE_IMAGE:-}" ]; then
            printf '::error title=8.7-B.1 build input::%s\n' \
              'e2e/pinned-images.txt did not export E2E_PYTHON_BASE_IMAGE'
            exit 1
          fi
          # Artifact and raw-log retrieval is unreliable for this
          # repository, so EVERY failure below is mirrored into the step
          # summary and into ::error annotations. A build or load that
          # fails silently (or in under a second) is otherwise
          # undiagnosable, which is exactly how the first run of this job
          # was lost.
          build_image() {
            local tag="$1"; shift
            local logfile="/tmp/build-${tag%%:*}.log"
            local code=0
            docker build --progress=plain "$@" -t "$tag" >"$logfile" 2>&1 || code=$?
            tail -n 25 "$logfile"
            if [ "$code" != "0" ]; then
              printf '::error title=8.7-B.1 image build failed (%s)::exit %s: %s\n' \
                "$tag" "$code" "$(tail -n 1 "$logfile")"
              {
                echo "### Phase 8.7-B.1 image build failed: ${tag} (exit ${code})"
                echo '```'
                tail -c 6000 "$logfile"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
            fi
            printf '::notice title=8.7-B.1 image built::%s id=%s\n' \
              "$tag" "$(docker image inspect --format '{{.Id}}' "$tag")"
          }
          load_image() {
            local image="$1"
            local logfile="/tmp/load-${image%%:*}.log"
            local code=0
            kind load docker-image "$image" --name ares-observation-e2e \
              >"$logfile" 2>&1 || code=$?
            tail -n 10 "$logfile"
            if [ "$code" != "0" ]; then
              printf '::error title=8.7-B.1 image load failed (%s)::exit %s: %s\n' \
                "$image" "$code" "$(tail -n 1 "$logfile")"
              {
                echo "### Phase 8.7-B.1 image load failed: ${image} (exit ${code})"
                echo '```'
                tail -c 4000 "$logfile"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
            fi
          }
          # Two builds of ONE workload fixture with different tracks: the
          # stable and canary backends differ in image identity as well as
          # in Deployment, so "two real workloads" is observable.
          build_image ares-observation-stable:local \
            -f e2e/traffic-topology/workload/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" --build-arg TRACK=stable \
            e2e/traffic-topology/workload
          build_image ares-observation-canary:local \
            -f e2e/traffic-topology/workload/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" --build-arg TRACK=canary \
            e2e/traffic-topology/workload
          build_image ares-observation-sampler:local \
            -f e2e/traffic-topology/sampler/Dockerfile \
            --build-arg "BASE_IMAGE=$E2E_PYTHON_BASE_IMAGE" \
            e2e/traffic-topology/sampler
          for IMAGE in ares-observation-stable:local ares-observation-canary:local \
                       ares-observation-sampler:local; do
            load_image "$IMAGE"
          done
          # Artifact and raw-log retrieval is unreliable for this
          # repository, so the driver's output is mirrored into the step
          # summary and annotations here. Without this a crash before the
          # driver can seal evidence would be invisible.
          set +e
          PYTHONPATH=. python e2e/traffic_observation_kind_e2e.py \
            --cluster ares-observation-e2e \
            --stable-image ares-observation-stable:local \
            --canary-image ares-observation-canary:local \
            --sampler-image ares-observation-sampler:local \
            --deployment-run-id "$GITHUB_RUN_ID" \
            --expected-commit "$GITHUB_SHA" \
            --gateway-api-version v1.4.1 \
            --envoy-gateway-version v1.6.7 \
            --destroy-cluster \
            --evidence traffic-observation-e2e.json 2>&1 | tee /tmp/8.7-b1.log
          CODE=${PIPESTATUS[0]}
          set -e
          if [ "$CODE" != "0" ]; then
            {
              echo '### Phase 8.7-B.1 traffic observation output (tail)'
              echo '```'
              tail -c 14000 /tmp/8.7-b1.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ ! -f traffic-observation-e2e.json ]; then
              tail -n 8 /tmp/8.7-b1.log | while IFS= read -r LINE; do
                printf '::error title=8.7-B.1 crash::%s\n' "${LINE//$'\r'/}"
              done
            fi
          fi
          exit "$CODE"
      - name: Publish live evidence
        if: always()
        run: |
          set +e
          if [ -f traffic-observation-e2e.json ]; then
            {
              echo '### Phase 8.7-B.1 weighted traffic topology evidence'
              echo '```json'
              cat traffic-observation-e2e.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tear down the cluster
        if: always()
        run: kind delete cluster --name ares-observation-e2e || true
      - uses: actions/upload-artifact@v4
        id: upload-traffic-observation-evidence
        if: always()
        with:
          name: traffic-observation-e2e-evidence
          path: |
            devops-ai-platform/traffic-observation-e2e.json
            devops-ai-platform/traffic-observation-e2e.json.sha256
          if-no-files-found: warn
      - name: Publish evidence provenance
        if: always()
        run: |
          set +e
          DIGEST=$(cat traffic-observation-e2e.json.sha256 2>/dev/null)
          ARTIFACT_ID="${{ steps.upload-traffic-observation-evidence.outputs.artifact-id }}"
          {
            echo '### Phase 8.7-B.1 weighted traffic topology provenance'
            echo "- python_run_id: ${{ github.run_id }} (attempt ${{ github.run_attempt }})"
            echo "- job_key: ${{ github.job }}"
            echo "- artifact_id: ${ARTIFACT_ID}"
            echo "- evidence_digest: ${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=8.7-B.1 evidence provenance::run_id=%s attempt=%s job=%s artifact_id=%s digest=%s\n' \
            "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.job }}" \
            "${ARTIFACT_ID}" "${DIGEST}"

